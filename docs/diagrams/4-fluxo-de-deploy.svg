<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font-size: 16px; font-weight: 600; }
      .sub { font-size: 13px; }
      .group { font-size: 14px; font-weight: 600; letter-spacing: 0.2px; }
      .edge { fill: none; stroke: #475569; stroke-width: 1.6; }
      .edge-strong { fill: none; stroke: #b45309; stroke-width: 3; }
      .label { font-size: 13px; fill: #334155; }
      .label-bg { fill: #ffffff; }
      .k8s { fill: #dbeafe; stroke: #2563eb; }
      .k8s-t { fill: #1e3a8a; }
      .tf { fill: #dcfce7; stroke: #16a34a; }
      .tf-t { fill: #14532d; }
      .ext { fill: #fef3c7; stroke: #d97706; }
      .ext-t { fill: #78350f; }
      .neutral { fill: #ffffff; stroke: #64748b; }
      .neutral-t { fill: #0f172a; }
      .node { stroke-width: 1.5; filter: url(#shadow); }
      .badge-t { font-size: 12px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1400" height="440" fill="#ffffff"/>

  <!-- ===== Raias ===== -->
  <rect x="20" y="20" width="1360" height="160" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1362" y="44" text-anchor="end" class="group" fill="#1e3a8a">CI · ci.yml · todo pull request e push na main</text>

  <rect x="20" y="240" width="1360" height="180" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1362" y="264" text-anchor="end" class="group" fill="#14532d">CD · cd.yml · tag MAJOR.MINOR.PATCH na main</text>

  <!-- ===== Arestas ===== -->
  <path class="edge" d="M260,110 H358" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,110 H818" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="660" y="86" width="140" height="17" rx="3"/>
  <text x="730" y="99" text-anchor="middle" class="label">checks verdes + review</text>
  <!-- Merge → guard (tag) -->
  <path class="edge-strong" d="M920,135 V210 H200 V286" marker-end="url(#arrow-strong)"/>
  <rect class="label-bg" x="500" y="200" width="120" height="20" rx="4"/>
  <text x="560" y="215" text-anchor="middle" class="label" font-weight="600" fill="#b45309">git tag 1.0.1</text>
  <!-- Jobs do CD -->
  <path class="edge" d="M320,340 H398" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,340 H718" marker-end="url(#arrow)"/>
  <path class="edge" d="M960,340 H1038" marker-end="url(#arrow)"/>

  <!-- ===== Nós: CI ===== -->
  <rect class="node ext" x="80" y="88" width="180" height="44" rx="22"/>
  <text x="170" y="115" text-anchor="middle" class="title ext-t">Pull request</text>

  <rect class="node neutral" x="360" y="65" width="280" height="90" rx="8"/>
  <text x="500" y="96" text-anchor="middle" class="title neutral-t">CI</text>
  <text x="500" y="118" text-anchor="middle" class="sub" fill="#475569">lint, testes e cobertura</text>
  <text x="500" y="137" text-anchor="middle" class="sub" fill="#475569">SCA, SAST e build da imagem</text>

  <rect class="node neutral" x="820" y="85" width="200" height="50" rx="8"/>
  <text x="920" y="115" text-anchor="middle" class="title neutral-t">Merge na main</text>

  <!-- ===== Nós: CD ===== -->
  <rect class="node neutral" x="80" y="300" width="240" height="80" rx="8"/>
  <circle cx="102" cy="322" r="11" fill="#475569"/>
  <text x="102" y="326" text-anchor="middle" class="badge-t">1</text>
  <text x="200" y="334" text-anchor="middle" class="title neutral-t">guard</text>
  <text x="200" y="356" text-anchor="middle" class="sub" fill="#475569">tag na main e CI verde?</text>

  <rect class="node tf" x="400" y="300" width="240" height="80" rx="8"/>
  <circle cx="422" cy="322" r="11" fill="#16a34a"/>
  <text x="422" y="326" text-anchor="middle" class="badge-t">2</text>
  <text x="520" y="334" text-anchor="middle" class="title tf-t">infra</text>
  <text x="520" y="356" text-anchor="middle" class="sub tf-t">terraform apply · state no S3</text>

  <rect class="node ext" x="720" y="300" width="240" height="80" rx="8"/>
  <circle cx="742" cy="322" r="11" fill="#d97706"/>
  <text x="742" y="326" text-anchor="middle" class="badge-t">3</text>
  <text x="840" y="334" text-anchor="middle" class="title ext-t">image</text>
  <text x="840" y="356" text-anchor="middle" class="sub ext-t">build e push no ECR</text>

  <rect class="node k8s" x="1040" y="300" width="280" height="80" rx="8"/>
  <circle cx="1062" cy="322" r="11" fill="#2563eb"/>
  <text x="1062" y="326" text-anchor="middle" class="badge-t">4</text>
  <text x="1180" y="334" text-anchor="middle" class="title k8s-t">deploy</text>
  <text x="1180" y="356" text-anchor="middle" class="sub k8s-t">migrations e rollout no EKS</text>
</svg>
