basePath: /
definitions:
  auth.LoginRequest:
    properties:
      email:
        example: usuario@oficina.com
        type: string
      senha:
        example: senha123
        type: string
    required:
    - email
    - senha
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        example: 9f8c1e...b3a0
        type: string
    required:
    - refresh_token
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      access_token_expires_in:
        example: 900
        type: integer
      refresh_token:
        example: 9f8c1e...b3a0
        type: string
      refresh_token_expires_in:
        example: 604800
        type: integer
      requer_alterar_senha:
        example: true
        type: boolean
    type: object
  cliente.AlterarSenhaRequest:
    properties:
      senha_nova:
        type: string
    required:
    - senha_nova
    type: object
  cliente.AtualizarClienteRequest:
    properties:
      email:
        example: maria@oficina.com
        type: string
      nome:
        example: Maria Silva
        type: string
      senha_nova:
        example: novaSenha123
        type: string
      telefone:
        example: "11999998888"
        type: string
    required:
    - email
    - nome
    - telefone
    type: object
  cliente.ClienteResponse:
    properties:
      ativo:
        example: true
        type: boolean
      criado_por:
        example: 1
        type: integer
      documento:
        example: "12345678909"
        type: string
      email:
        example: maria@oficina.com
        type: string
      id:
        example: 1
        type: integer
      nome:
        example: Maria Silva
        type: string
      requer_alterar_senha:
        example: true
        type: boolean
      telefone:
        example: "11999998888"
        type: string
      tipo_pessoa:
        example: PF
        type: string
    type: object
  cliente.CriarClienteRequest:
    properties:
      documento:
        example: "12345678909"
        type: string
      email:
        example: maria@oficina.com
        type: string
      nome:
        example: Maria Silva
        type: string
      senha:
        example: senha123
        type: string
      telefone:
        example: "11999998888"
        type: string
      tipo_pessoa:
        example: PF
        type: string
    required:
    - documento
    - email
    - nome
    - senha
    - telefone
    - tipo_pessoa
    type: object
  cliente.ListarClientesResponse:
    properties:
      direction:
        example: ASC
        type: string
      items:
        items:
          $ref: '#/definitions/cliente.ClienteResponse'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      order:
        example: nome
        type: string
      total:
        example: 42
        type: integer
    type: object
  health.HealthCheckResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  httperror.ErrorResponse:
    properties:
      details:
        items:
          type: string
        type: array
      message:
        example: corpo inválido
        type: string
      type:
        example: validation
        type: string
    type: object
  ordemservico.AbrirOrdemServicoRequest:
    properties:
      cliente_id:
        example: 1
        type: integer
      observacoes:
        example: Cliente relatou ruído no motor
        type: string
      quilometragem_entrada:
        example: 52300
        type: integer
      veiculo_id:
        example: 1
        type: integer
    required:
    - cliente_id
    - veiculo_id
    type: object
  ordemservico.InformarDiagnosticoRequest:
    properties:
      diagnostico:
        example: Falha na bomba de combustível
        type: string
    type: object
  ordemservico.OrdemServicoResponse:
    properties:
      cliente_id:
        example: 1
        type: integer
      diagnostico:
        example: ""
        type: string
      id:
        example: 1
        type: integer
      numero:
        example: OS-20260826-a1b2c3d4e5f6
        type: string
      observacoes:
        example: Cliente relatou ruído no motor
        type: string
      quilometragem_entrada:
        example: 52300
        type: integer
      status:
        example: RECEBIDA
        type: string
      veiculo_id:
        example: 1
        type: integer
    type: object
  peca.AtualizarPecaRequest:
    properties:
      descricao:
        example: Pastilha de freio dianteira
        type: string
      estoque_minimo:
        example: 5
        type: integer
      marca:
        example: Bosch
        type: string
      nome:
        example: Pastilha de freio
        type: string
      preco:
        example: 89.9
        type: number
    required:
    - descricao
    - marca
    - nome
    - preco
    type: object
  peca.CadastrarPecaRequest:
    properties:
      descricao:
        example: Pastilha de freio dianteira
        type: string
      estoque_minimo:
        example: 5
        type: integer
      marca:
        example: Bosch
        type: string
      nome:
        example: Pastilha de freio
        type: string
      preco:
        example: 89.9
        type: number
      quantidade_em_estoque:
        example: 20
        type: integer
    required:
    - descricao
    - marca
    - nome
    - preco
    type: object
  peca.PecaResponse:
    properties:
      ativo:
        example: true
        type: boolean
      codigo:
        example: PC1J3K2L1M0N
        type: string
      criado_por:
        example: 1
        type: integer
      descricao:
        example: Pastilha de freio dianteira
        type: string
      estoque_minimo:
        example: 5
        type: integer
      id:
        example: 1
        type: integer
      marca:
        example: Bosch
        type: string
      nome:
        example: Pastilha de freio
        type: string
      preco:
        example: 89.9
        type: number
      quantidade_em_estoque:
        example: 20
        type: integer
    type: object
  peca.ReporEstoqueRequest:
    properties:
      quantidade:
        example: 10
        type: integer
    required:
    - quantidade
    type: object
  relatorio.TransicaoStatusResponse:
    properties:
      tempo_maximo:
        example: 3
        type: number
      tempo_medio:
        example: 1.5
        type: number
      tempo_minimo:
        example: 0.5
        type: number
      total_ordens_servico:
        example: 12
        type: integer
      unidade:
        example: h
        type: string
    type: object
  servico.AtualizarServicoRequest:
    properties:
      descricao:
        example: Alinhamento e balanceamento
        type: string
      nome:
        example: Alinhamento
        type: string
      preco_base:
        example: 200.75
        type: number
      tempo_estimado_minutos:
        example: 90
        type: integer
    required:
    - descricao
    - nome
    - preco_base
    - tempo_estimado_minutos
    type: object
  servico.CriarServicoRequest:
    properties:
      descricao:
        example: Troca de óleo e filtro
        type: string
      nome:
        example: Troca de óleo
        type: string
      preco_base:
        example: 150.5
        type: number
      tempo_estimado_minutos:
        example: 60
        type: integer
    required:
    - descricao
    - nome
    - preco_base
    - tempo_estimado_minutos
    type: object
  servico.ListarServicosResponse:
    properties:
      direction:
        example: ASC
        type: string
      items:
        items:
          $ref: '#/definitions/servico.ServicoResponse'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      order:
        example: nome
        type: string
      total:
        example: 42
        type: integer
    type: object
  servico.ServicoResponse:
    properties:
      ativo:
        example: true
        type: boolean
      criado_por:
        example: 1
        type: integer
      descricao:
        example: Troca de óleo e filtro
        type: string
      id:
        example: 1
        type: integer
      nome:
        example: Troca de óleo
        type: string
      preco_base:
        example: 150.5
        type: number
      tempo_estimado_minutos:
        example: 60
        type: integer
    type: object
  shared.PapelUsuario:
    enum:
    - ADMINISTRADOR
    - MECANICO
    - ATENDENTE
    - CLIENTE
    type: string
    x-enum-varnames:
    - PapelAdmin
    - PapelMecanico
    - PapelAtendente
    - PapelCliente
  usuario.AlterarSenhaRequest:
    properties:
      senha_nova:
        example: novaSenha123
        type: string
    type: object
  usuario.AtualizarUsuarioRequest:
    properties:
      email:
        example: ana@oficina.com
        type: string
      nome:
        example: Ana Souza
        type: string
      papel:
        allOf:
        - $ref: '#/definitions/shared.PapelUsuario'
        example: ATENDENTE
      senha_nova:
        example: novaSenha123
        type: string
    required:
    - email
    - nome
    - papel
    type: object
  usuario.CriarUsuarioRequest:
    properties:
      email:
        example: ana@oficina.com
        type: string
      nome:
        example: Ana Souza
        type: string
      papel:
        allOf:
        - $ref: '#/definitions/shared.PapelUsuario'
        example: MECANICO
      senha:
        example: senha123
        type: string
    required:
    - email
    - nome
    - papel
    - senha
    type: object
  usuario.UsuarioResponse:
    properties:
      ativo:
        example: true
        type: boolean
      email:
        example: ana@oficina.com
        type: string
      id:
        example: 1
        type: integer
      nome:
        example: Ana Souza
        type: string
      papel:
        allOf:
        - $ref: '#/definitions/shared.PapelUsuario'
        example: MECANICO
      requer_alterar_senha:
        example: true
        type: boolean
    type: object
  veiculo.AtualizarVeiculoRequest:
    properties:
      cor:
        example: Prata
        type: string
      marca:
        example: Fiat
        type: string
      modelo:
        example: Uno
        type: string
      quilometragem_atual:
        example: 15500
        type: integer
    required:
    - cor
    - marca
    - modelo
    type: object
  veiculo.CadastrarVeiculoRequest:
    properties:
      ano:
        example: 2020
        type: integer
      cor:
        example: Prata
        type: string
      marca:
        example: Fiat
        type: string
      modelo:
        example: Uno
        type: string
      placa:
        example: ABC1D23
        type: string
      quilometragem_atual:
        example: 15000
        type: integer
    required:
    - ano
    - cor
    - marca
    - modelo
    - placa
    type: object
  veiculo.VeiculoResponse:
    properties:
      ano:
        example: 2020
        type: integer
      ativo:
        example: true
        type: boolean
      cor:
        example: Prata
        type: string
      criado_por:
        example: 1
        type: integer
      id:
        example: 1
        type: integer
      marca:
        example: Fiat
        type: string
      modelo:
        example: Uno
        type: string
      placa:
        example: ABC1D23
        type: string
      quilometragem_atual:
        example: 15000
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: API de gestão de ordens de serviço de uma oficina mecânica. Tech Challenge
    Fase 1 - Soat.
  title: Sistema de Oficina Mecânica API
  version: "1.0"
paths:
  /v1/auth/cliente/login:
    post:
      consumes:
      - application/json
      description: Autentica por email+senha e emite o par access+refresh token
      parameters:
      - description: Credenciais
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
      summary: Login de cliente
      tags:
      - Auth Cliente
  /v1/auth/cliente/logout:
    post:
      consumes:
      - application/json
      description: Revoga o refresh token informado (idempotente)
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Sem conteúdo
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
      summary: Logout de cliente
      tags:
      - Auth Cliente
  /v1/auth/cliente/refresh:
    post:
      consumes:
      - application/json
      description: Troca um refresh token válido por um novo par access+refresh (rotação)
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
      summary: Refresh de token de cliente
      tags:
      - Auth Cliente
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Autentica por email+senha e emite o par access+refresh token
      parameters:
      - description: Credenciais
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
      summary: Login de usuário interno
      tags:
      - Auth Interno
  /v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revoga o refresh token informado (idempotente)
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Sem conteúdo
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
      summary: Logout de usuário interno
      tags:
      - Auth Interno
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Troca um refresh token válido por um novo par access+refresh (rotação)
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
      summary: Refresh de token de usuário interno
      tags:
      - Auth Interno
  /v1/clientes:
    get:
      description: Lista clientes com paginação, ordenação e filtros diretos por campo.
        Texto usa LIKE, listas separadas por vírgula usam IN, booleanos usam igualdade
        e duas datas ISO 8601 formam um intervalo. Use o sufixo _not para negar filtros
        textuais.
      parameters:
      - default: 0
        description: Quantidade de registros ignorados
        in: query
        minimum: 0
        name: offset
        type: integer
      - default: 20
        description: Quantidade de registros retornados
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: id
        description: Campo de ordenação
        enum:
        - id
        - documento
        - tipo
        - nome
        - email
        - telefone
        - ativo
        - requer_alterar_senha
        - criado_por
        - data_cadastro
        - data_atualizacao
        in: query
        name: order
        type: string
      - default: ASC
        description: Direção da ordenação
        enum:
        - ASC
        - DESC
        in: query
        name: direction
        type: string
      - description: ID ou lista de IDs separada por vírgula
        example: 1,2,3
        in: query
        name: id
        type: string
      - description: Documento contendo o valor
        in: query
        name: documento
        type: string
      - description: Tipo de pessoa contendo o valor
        enum:
        - PF
        - PJ
        in: query
        name: tipo
        type: string
      - description: Nome contendo o valor
        example: Maria
        in: query
        name: nome
        type: string
      - description: Nome que não deve conter o valor
        example: Teste
        in: query
        name: nome_not
        type: string
      - description: E-mail contendo o valor
        in: query
        name: email
        type: string
      - description: Telefone contendo o valor
        in: query
        name: telefone
        type: string
      - description: Situação ativa do cliente
        in: query
        name: ativo
        type: boolean
      - description: ID ou lista de IDs dos criadores
        in: query
        name: criado_por
        type: string
      - description: Data ISO 8601 ou intervalo separado por vírgula
        example: 2026-08-20,2026-08-22
        in: query
        name: data_cadastro
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cliente.ListarClientesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Lista clientes
      tags:
      - Clientes
    post:
      consumes:
      - application/json
      description: Cria um cliente para atendimento da oficina.
      parameters:
      - description: Dados do cliente
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cliente.CriarClienteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/cliente.ClienteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cria cliente
      tags:
      - Clientes
  /v1/clientes/{id}:
    get:
      description: Retorna os dados de um cliente pelo identificador.
      parameters:
      - description: ID do cliente
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cliente.ClienteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Busca cliente por ID
      tags:
      - Clientes
    put:
      consumes:
      - application/json
      description: Atualiza os dados cadastrais de um cliente.
      parameters:
      - description: ID do cliente
        in: path
        name: id
        required: true
        type: integer
      - description: Dados atualizados
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cliente.AtualizarClienteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cliente.ClienteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualiza cliente
      tags:
      - Clientes
  /v1/clientes/{id}/ativar:
    patch:
      description: Reabilita o cliente para login e uso do sistema.
      parameters:
      - description: ID do cliente
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Sem conteúdo
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Ativa cliente
      tags:
      - Clientes
  /v1/clientes/{id}/inativar:
    patch:
      description: Bloqueia o cliente para login e uso do sistema.
      parameters:
      - description: ID do cliente
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Sem conteúdo
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "404":
          description: Not Found
