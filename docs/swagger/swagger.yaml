basePath: /
host: http://localhost:8080
info:
  contact: {}
  description: API de gestão de ordens de serviço de uma oficina mecânica. Tech Challenge
    Fase 1 - Soat.
  title: Sistema de Oficina Mecânica API
  version: "1.0"
paths:
  /v1/health:
    get:
      description: Retorna 200 se a API e a conexão com o MySQL estão respondendo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verifica saúde da API
      tags:
      - health
schemes:
- http
swagger: "2.0"
