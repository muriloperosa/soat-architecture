basePath: /
definitions:
  auth.LoginRequest:
    properties:
      email:
        example: usuario@oficina.com
        type: string
      senha:
        example: senha123
        type: string
    required:
    - email
    - senha
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        example: 9f8c1e...b3a0
        type: string
    required:
    - refresh_token
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      refresh_token:
        example: 9f8c1e...b3a0
        type: string
    type: object
  health.HealthCheckResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  httperror.ErrorResponse:
    properties:
      details:
        items:
          type: string
        type: array
      message:
        example: corpo inválido
        type: string
      type:
        example: validation
        type: string
    type: object
host: http://localhost:8080
info:
  contact: {}
  description: API de gestão de ordens de serviço de uma oficina mecânica. Tech Challenge
    Fase 1 - Soat.
  title: Sistema de Oficina Mecânica API
  version: "1.0"
paths:
  /v1/auth/cliente/login:
    post:
      consumes:
      - application/json
      description: Autentica por email+senha e emite o par access+refresh token
      parameters:
      - description: Credenciais
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
      summary: Login de cliente
      tags:
      - Auth Cliente
  /v1/auth/cliente/logout:
    post:
      consumes:
      - application/json
      description: Revoga o refresh token informado (idempotente)
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Sem conteúdo
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
      summary: Logout de cliente
      tags:
      - Auth Cliente
  /v1/auth/cliente/refresh:
    post:
      consumes:
      - application/json
      description: Troca um refresh token válido por um novo par access+refresh (rotação)
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
      summary: Refresh de token de cliente
      tags:
      - Auth Cliente
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Autentica por email+senha e emite o par access+refresh token
      parameters:
      - description: Credenciais
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
      summary: Login de usuário interno
      tags:
      - Auth Interno
  /v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revoga o refresh token informado (idempotente)
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Sem conteúdo
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
      summary: Logout de usuário interno
      tags:
      - Auth Interno
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Troca um refresh token válido por um novo par access+refresh (rotação)
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
      summary: Refresh de token de usuário interno
      tags:
      - Auth Interno
  /v1/health:
    get:
      description: Retorna 200 se a API e a conexão com o MySQL estão respondendo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.HealthCheckResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httperror.ErrorResponse'
      summary: Verifica saúde da API
      tags:
      - Health
schemes:
- http
swagger: "2.0"
