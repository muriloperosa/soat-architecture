services:
  app:
    build: .
    ports:
      - "${APP_HOST_PORT:-8080}:${APP_PORT:-8080}"
    environment:
      APP_PORT: "${APP_PORT:-8080}"
      DB_HOST: mysql
      DB_PORT: "${DB_PORT:-3306}"
      DB_USER: "${DB_USER:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-root}"
      DB_NAME: "${DB_NAME:-mecanica}"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_NAME:-mecanica}"
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
