name: CD (Continuous Deployment)

# Releases are triggered by a semver tag (e.g. 1.0.1) on a commit in main. The
# tag provisions the environment (terraform apply of infra/) and deploys that
# version: no manual apply is needed before tagging.
# workflow_dispatch is for redeploy or rollback: run it picking a tag in
# "Use workflow from".
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

# AWS Academy Learner Lab: no OIDC provider or IAM role can be created, so the
# jobs use the lab session credentials stored as secrets of the aws-deploy
# environment. They expire with the lab session (docs/CI_CD.md).
permissions:
  contents: read

# One deploy at a time, never cancelled midway: interrupting a terraform apply,
# a migration Job or a rollout leaves the environment in an intermediate state.
concurrency:
  group: deploy-eks
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'oficina' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'oficina-api' }}
  APP_SECRET_ID: ${{ vars.APP_SECRET_ID || 'oficina/api' }}
  SMTP_SECRET_ID: ${{ vars.SMTP_SECRET_ID || 'oficina/smtp' }}

jobs:
  # Stage 0: GitHub's tag filter ignores the branch, so the tag's origin is
  # checked here. The main ruleset already requires CI on every merge, so
  # instead of re-running it this job requires the "CI gate" check of the
  # tagged commit to be green.
  guard:
    name: Validate release tag and CI
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag format and origin
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::O deploy só roda a partir de uma tag (recebido: ${REF_TYPE} ${REF_NAME})."
            exit 1
          fi
          if [[ ! "$REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A tag ${REF_NAME} não segue o formato MAJOR.MINOR.PATCH (ex.: 1.0.1)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::O commit da tag ${REF_NAME} (${GITHUB_SHA}) não está na main."
            exit 1
          fi
          echo "version=${REF_NAME}" >> "$GITHUB_OUTPUT"

      # Waits while CI is still running (tag pushed right after the merge) and
      # fails if the latest "CI gate" run of this commit did not succeed.
      - name: Require green CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for _ in $(seq 1 60); do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=CI%20gate&filter=latest" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last // empty')"
            if [[ -z "$run" ]]; then
              echo "::error::Nenhuma execução do CI gate para ${GITHUB_SHA}. Commits só com Markdown não disparam a CI no push; rode a CI manualmente na main (Actions → CI → Run workflow) e tente o deploy de novo."
              exit 1
            fi
            status="$(jq -r .status <<<"$run")"
            conclusion="$(jq -r .conclusion <<<"$run")"
            url="$(jq -r .html_url <<<"$run")"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                echo "CI gate verde: ${url}"
                exit 0
              fi
              echo "::error::O CI gate de ${GITHUB_SHA} terminou como ${conclusion}: ${url}"
              exit 1
            fi
            echo "CI gate ainda em ${status}, aguardando... (${url})"
            sleep 30
          done
          echo "::error::Timeout esperando o CI gate de ${GITHUB_SHA}."
          exit 1

  # Stage 1: Terraform apply of infra/ (EKS cluster, RDS, ECR, app and SMTP secrets).
  # The state lives in S3; the bucket is created on the first
  # run of a new lab account. A failure here leaves the cluster untouched.
  infra:
    name: Terraform apply
    needs: [guard]
    runs-on: ubuntu-24.04
    environment: aws-deploy
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_cluster_name: ${{ vars.EKS_CLUSTER_NAME || 'oficina' }}
      TF_VAR_ecr_repository_name: ${{ vars.ECR_REPOSITORY || 'oficina-api' }}
      TF_VAR_app_secret_name: ${{ vars.APP_SECRET_ID || 'oficina/api' }}
      TF_VAR_smtp_secret_name: ${{ vars.SMTP_SECRET_ID || 'oficina/smtp' }}
      TF_VAR_smtp_host: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
      TF_VAR_smtp_port: ${{ vars.SMTP_PORT || '587' }}
      TF_VAR_smtp_username: ${{ vars.SMTP_USERNAME || 'soatoficinapos@gmail.com' }}
      TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
      TF_VAR_smtp_from_address: ${{ vars.SMTP_FROM_ADDRESS || 'soatoficinapos@gmail.com' }}
      TF_VAR_smtp_secret_version: ${{ vars.SMTP_SECRET_VERSION || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Validate SMTP app password
        shell: bash
        run: |
          if [[ -z "$TF_VAR_smtp_password" ]]; then
            echo "::error::Cadastre SMTP_PASSWORD como secret no environment aws-deploy."
            exit 1
          fi
          echo "::add-mask::${TF_VAR_smtp_password}"

      - name: Terraform init
        run: |
          bucket="$(bash bootstrap-state.sh)"
          terraform init -input=false \
            -backend-config="bucket=${bucket}" \
            -backend-config="key=oficina/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false tfplan

  # Stage 2: image tagged with the release version, pushed to the ECR repository
  # created by Terraform. ECR tags are immutable; redeploying the same version
  # reuses the existing image.
  image:
    name: Build and push image to ECR
    needs: [guard, infra]
    runs-on: ubuntu-24.04
    environment: aws-deploy
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          # The account ID is part of the image URL, which is a job output. If
          # it were masked, GitHub would drop the output.
          mask-aws-account-id: false

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Resolve image name
        id: meta
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          VERSION: ${{ needs.guard.outputs.version }}
        shell: bash
        run: |
          # Only "image not found" means a new version; any other error
          # (missing repository, expired lab credentials) fails the job.
          if err="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$VERSION" 2>&1 >/dev/null)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$err" == *ImageNotFoundException* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$err" >&2
            echo "::error::Falha ao consultar o ECR ${ECR_REPOSITORY}. Confira se o Terraform criou o repositório e se as credenciais do lab não expiraram (docs/CI_CD.md)."
            exit 1
          fi
          echo "image=${REGISTRY}/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.meta.outputs.exists == 'false'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          docker build \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:${VERSION}" .
          docker push "${IMAGE}:${VERSION}"

      - name: Reuse existing image
        if: steps.meta.outputs.exists == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: echo "::notice::${IMAGE}:${VERSION} já existe no ECR; build e push pulados."

  # Stage 3: ConfigMap and Secret, migration Job and API rollout, in the order
  # of make k8s-deploy (ADR 0006). Secrets come from AWS Secrets Manager.
  deploy:
    name: Deploy to EKS (migrations and rollout)
    needs: [guard, infra, image]
    runs-on: ubuntu-24.04
    environment:
      name: aws-deploy
      url: ${{ steps.summary.outputs.url }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TERM: dumb
      KUBE_CONTEXT: oficina-eks
      SECRETS_FILE: k8s/overlays/eks/secrets.env
      OVERLAY_FILE: k8s/overlays/eks/kustomization.yaml
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" --alias "$KUBE_CONTEXT"

      - name: Validate approval-link configuration
        shell: bash
        run: |
          if [[ ! "$PUBLIC_BASE_URL" =~ ^https?://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]]; then
            echo "::error::Configure PUBLIC_BASE_URL como origem publica da API, sem caminho como /v1/health."
            exit 1
          fi

      - name: Load application secrets from Secrets Manager
        shell: bash
        run: |
          payload="$(aws secretsmanager get-secret-value --secret-id "$APP_SECRET_ID" --query SecretString --output text)"
          for key in DB_HOST DB_USER DB_PASSWORD JWT_SECRET APPROVAL_TOKEN_SECRET; do
            if [[ -z "$(jq -r --arg k "$key" '.[$k] // empty' <<<"$payload")" ]]; then
              echo "::error::Chave ${key} ausente no secret ${APP_SECRET_ID}."
              exit 1
            fi
          done
          db_password="$(jq -r .DB_PASSWORD <<<"$payload")"
          jwt_secret="$(jq -r .JWT_SECRET <<<"$payload")"
          approval_token_secret="$(jq -r .APPROVAL_TOKEN_SECRET <<<"$payload")"
          echo "::add-mask::${db_password}"
          echo "::add-mask::${jwt_secret}"
          echo "::add-mask::${approval_token_secret}"
          if [[ ! "$approval_token_secret" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::APPROVAL_TOKEN_SECRET no secret ${APP_SECRET_ID} deve conter 32 bytes aleatorios em hexadecimal."
            exit 1
          fi
          # The password goes into the migration Job's URL (ADR 0006).
          if [[ ! "$db_password" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "::error::DB_PASSWORD precisa ter apenas letras e números."
            exit 1
          fi
          umask 077
          printf 'DB_PASSWORD=%s\nJWT_SECRET=%s\n' "$db_password" "$jwt_secret" > "$SECRETS_FILE"
          printf 'APPROVAL_TOKEN_SECRET=%s\nAPPROVAL_TOKEN_TTL_HOURS=24\nPUBLIC_BASE_URL=%s\n' \
            "$approval_token_secret" "$PUBLIC_BASE_URL" >> "$SECRETS_FILE"
          db_host="$(jq -r .DB_HOST <<<"$payload")"
          db_user="$(jq -r .DB_USER <<<"$payload")"
          if [[ ! "$db_host" =~ ^[A-Za-z0-9.-]+$ || ! "$db_user" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "::error::DB_HOST ou DB_USER com caracteres inválidos."
            exit 1
          fi
          # The versioned overlay has placeholders for the database endpoint and
          # user. They are replaced only in the runner's checkout, never committed.
          for placeholder in REPLACE_WITH_RDS_ENDPOINT REPLACE_WITH_RDS_USERNAME REPLACE_WITH_EMAIL_PROVIDER REPLACE_WITH_SES_FROM_ADDRESS; do
            if ! grep -q "$placeholder" "$OVERLAY_FILE"; then
              echo "::error::Placeholder ${placeholder} não encontrado em ${OVERLAY_FILE}."
              exit 1
            fi
          done
          ses_from="$(jq -r '.SES_FROM_ADDRESS // empty' <<<"$payload")"
          email_provider=log
          if [[ -n "$SMTP_SECRET_ID" ]]; then
            smtp_payload="$(aws secretsmanager get-secret-value --secret-id "$SMTP_SECRET_ID" --query SecretString --output text)"
            for key in SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD SMTP_FROM_ADDRESS; do
              if [[ -z "$(jq -r --arg k "$key" '.[$k] // empty' <<<"$smtp_payload")" ]]; then
                echo "::error::Chave ${key} ausente no secret ${SMTP_SECRET_ID}."
                exit 1
              fi
            done
            smtp_host="$(jq -r .SMTP_HOST <<<"$smtp_payload")"
            smtp_port="$(jq -r .SMTP_PORT <<<"$smtp_payload")"
            smtp_username="$(jq -r .SMTP_USERNAME <<<"$smtp_payload")"
            smtp_password="$(jq -r .SMTP_PASSWORD <<<"$smtp_payload")"
            smtp_from="$(jq -r .SMTP_FROM_ADDRESS <<<"$smtp_payload")"
            if [[ ! "$smtp_host" =~ ^[A-Za-z0-9.-]+$ || ! "$smtp_port" =~ ^[0-9]+$ ]]; then
              echo "::error::SMTP_HOST ou SMTP_PORT inválido no secret ${SMTP_SECRET_ID}."
              exit 1
            fi
            echo "::add-mask::${smtp_password}"
            printf 'SMTP_HOST=%s\nSMTP_PORT=%s\nSMTP_USERNAME=%s\nSMTP_PASSWORD=%s\nSMTP_FROM_ADDRESS=%s\n' \
              "$smtp_host" "$smtp_port" "$smtp_username" "$smtp_password" "$smtp_from" >> "$SECRETS_FILE"
            email_provider=smtp
          elif [[ -n "$ses_from" ]]; then
            email_provider=ses
          fi
          sed -i \
            -e "s|REPLACE_WITH_RDS_ENDPOINT|${db_host}|" \
            -e "s|REPLACE_WITH_RDS_USERNAME|${db_user}|" \
            -e "s|REPLACE_WITH_EMAIL_PROVIDER|${email_provider}|" \
            -e "s|REPLACE_WITH_SES_FROM_ADDRESS|${ses_from}|" \
            "$OVERLAY_FILE"

      - name: Apply config, run migrations and roll out API
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          make k8s-deploy \
            K8S_OVERLAY=eks \
            KUBE_CONTEXT="$KUBE_CONTEXT" \
            IMAGE_NAME="$IMAGE" \
            IMAGE_TAG="$VERSION"

      - name: Diagnostics
        if: failure()
        run: |
          kubectl --context "$KUBE_CONTEXT" -n oficina get pods,jobs,svc,hpa || true
          kubectl --context "$KUBE_CONTEXT" -n oficina logs job/oficina-migrate --tail=100 || true
          kubectl --context "$KUBE_CONTEXT" -n oficina describe deployment oficina-api || true
          kubectl --context "$KUBE_CONTEXT" -n oficina get events --sort-by=.lastTimestamp | tail -n 30 || true

      - name: Remove secrets file
        if: always()
        run: rm -f "$SECRETS_FILE"

      # The LoadBalancer DNS can take a few minutes to show up; its absence does
      # not invalidate the deploy, which already passed rollout status.
      - name: Summary
        id: summary
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          VERSION: ${{ needs.guard.outputs.version }}
        shell: bash
        run: |
          host=""
          for _ in $(seq 1 36); do
            host="$(kubectl --context "$KUBE_CONTEXT" -n oficina get svc oficina-api \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
            [[ -n "$host" ]] && break
            sleep 5
          done
          url="${host:+http://${host}}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy ${VERSION}"
            echo
            echo "| Item | Valor |"
            echo "| --- | --- |"
            echo "| Versão | \`${VERSION}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Imagem | \`${IMAGE}:${VERSION}\` |"
            echo "| Cluster | \`${EKS_CLUSTER_NAME}\` (${AWS_REGION}) |"
            echo "| URL da API | ${url:-ainda sem hostname do LoadBalancer} |"
          } >> "$GITHUB_STEP_SUMMARY"
