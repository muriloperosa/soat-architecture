name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'
  COVERAGE_FILE: coverage.out

jobs:
  unit:
    name: Format, test, coverage and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [[ -n "$files" ]]; then
            echo "Go files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests and coverage profile
        run: go test ./... -coverprofile="${COVERAGE_FILE}" -covermode=atomic

      - name: Install go-test-coverage
        run: go install github.com/vladopajic/go-test-coverage/v2@v2.20.0

      - name: Enforce 80% coverage per package
        run: "$(go env GOPATH)/bin/go-test-coverage --config=.testcoverage.yml"

      - name: Build
        run: go build ./...

      - name: Upload coverage profile
        if: always() && hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v4.4.3
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

  integration:
    name: Integration tests (MySQL 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Run integration tests
        run: go test -tags integration ./test/integration/... -v

  sca:
    name: SCA (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Scan reachable vulnerabilities
        run: "$(go env GOPATH)/bin/govulncheck -json ./... > govulncheck.json"

      - name: Enforce SCA severity policy
        if: always() && hashFiles('govulncheck.json') != ''
        run: go run ./.github/scripts/check_security.go govulncheck govulncheck.json

      - name: Upload SCA report
        if: always() && hashFiles('govulncheck.json') != ''
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v4.4.3
        with:
          name: govulncheck-report
          path: govulncheck.json
          retention-days: 7

  sast:
    name: SAST (gosec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.8

      - name: Scan source
        run: "$(go env GOPATH)/bin/gosec -fmt=json -out=gosec.json ./..."

      - name: Enforce SAST severity policy
        if: always() && hashFiles('gosec.json') != ''
        run: go run ./.github/scripts/check_security.go gosec gosec.json

      - name: Upload SAST report
        if: always() && hashFiles('gosec.json') != ''
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v4.4.3
        with:
          name: gosec-report
          path: gosec.json
          retention-days: 7
