name: CI (Continuous Integration)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# PRs: a new push cancels the previous run of the same PR. Pushes to main and
# manual runs get one group per commit and are never cancelled, so every main
# commit gets its own "CI gate" result (the CD workflow requires it).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.26.10'
  COVERAGE_FILE: coverage.out

jobs:
  # Stage 1: prepare generated source files before project validation.
  generated:
    name: Generated mocks and Swagger
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install generators
        run: |
          go install github.com/vektra/mockery/v2@v2.53.7
          go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Regenerate mocks and Swagger
        run: |
          "$(go env GOPATH)/bin/mockery"
          "$(go env GOPATH)/bin/swag" init -g cmd/api/main.go -o docs/swagger

      - name: Ensure generated files are committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # Stage 2: quality, unit, and integration checks run in parallel.
  quality:
    name: Format, vet and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [generated]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [[ -n "$files" ]]; then
            echo "Go files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [generated]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Unit tests and coverage profile
        run: go test ./... -coverprofile="${COVERAGE_FILE}" -covermode=atomic

      - name: Install go-test-coverage
        # v2.19.0 is the latest release that builds with Go 1.26; setup-go sets
        # GOTOOLCHAIN=local, so tools requiring a newer Go fail to install.
        run: go install github.com/vladopajic/go-test-coverage/v2@v2.19.0

      - name: Enforce 80% coverage per package
        id: coverage_gate
        shell: bash
        run: |
          set -o pipefail
          "$(go env GOPATH)/bin/go-test-coverage" --config=.testcoverage.yml --github-action-output=true | tee coverage-gate.log

      - name: Add coverage summary
        if: always() && hashFiles('coverage.out') != ''
        env:
          COVERAGE_GATE_RESULT: ${{ steps.coverage_gate.outcome }}
          ELIGIBLE_COVERAGE: ${{ steps.coverage_gate.outputs['total-coverage'] }}
        shell: bash
        run: |
          raw_coverage="$(go tool cover -func="$COVERAGE_FILE" | awk '/^total:/ { print $3 }' || true)"
          eligible_coverage="$(awk '/^Total test coverage:/ { print $4 }' coverage-gate.log 2>/dev/null | tail -n 1 || true)"
          if [[ -z "$eligible_coverage" ]]; then
            eligible_coverage="${ELIGIBLE_COVERAGE}%"
          fi
          if [[ -z "$raw_coverage" ]]; then
            raw_coverage="indisponível"
          fi
          if [[ -z "$eligible_coverage" || "$eligible_coverage" == "%" ]]; then
            eligible_coverage="indisponível"
          fi

          case "$COVERAGE_GATE_RESULT" in
            success) gate_result="✅ Aprovado" ;;
            failure) gate_result="❌ Falhou" ;;
            *) gate_result="⏭️ Não executado" ;;
          esac

          {
            echo "## Cobertura de testes"
            echo
            echo "| Métrica | Resultado |"
            echo "| --- | ---: |"
            echo "| Cobertura bruta do perfil | ${raw_coverage} |"
            echo "| Cobertura no escopo do gate | **${eligible_coverage}** |"
            echo "| Mínimo por pacote | **80%** |"
            echo "| Gate de cobertura | ${gate_result} |"
            echo
            echo 'A cobertura bruta inclui código fora do gate. O cálculo do gate exclui mocks, código gerado (`.gen.go` e `.pb.go`), `cmd/`, `docs/swagger/`, `migrations/` e `test/helpers/`, conforme `.testcoverage.yml`.'
            echo
            echo 'O perfil completo está disponível no artefato `go-coverage`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        if: always() && hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

  integration:
    name: Integration tests (MySQL 8)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [generated]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Run integration tests
        run: go test -tags integration ./test/integration/... -v

  sca:
    name: SCA (govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Stage 3: security checks start only after all validation checks pass.
    needs: [quality, unit, integration]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Scan reachable vulnerabilities
        run: "$(go env GOPATH)/bin/govulncheck -json ./... > govulncheck.json"

      - name: Enforce SCA severity policy
        if: always() && hashFiles('govulncheck.json') != ''
        run: go run ./.github/scripts/check_security.go govulncheck govulncheck.json

      - name: Upload SCA report
        if: always() && hashFiles('govulncheck.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: govulncheck-report
          path: govulncheck.json
          retention-days: 7

  sast:
    name: SAST (gosec)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [quality, unit, integration]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.8

      - name: Scan source
        run: "$(go env GOPATH)/bin/gosec -no-fail -fmt=json -out=gosec.json ./..."

      - name: Enforce SAST severity policy
        if: always() && hashFiles('gosec.json') != ''
        run: go run ./.github/scripts/check_security.go gosec gosec.json

      - name: Upload SAST report
        if: always() && hashFiles('gosec.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gosec-report
          path: gosec.json
          retention-days: 7

  image:
    name: Build Docker image (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Stage 4: Docker build after the security jobs pass.
    needs: [sca, sast]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag "soat-architecture:${GITHUB_SHA}" .

  ci_gate:
    name: CI gate
    if: ${{ always() }}
    needs: [generated, quality, unit, integration, sca, sast, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          printf '%s\n' "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "$NEEDS_JSON" | jq -e 'length == 7 and all(.[]; .result == "success")'
