# Exemplo completo das variáveis injetadas pela API. Este manifesto é apenas
# referência para configuração manual/local, como Minikube. Docker Compose
# usa as variáveis do .env, não este Secret. Nos overlays Kustomize, o Secret
# é gerado de overlays/{minikube,eks}/secrets.env; não aplique este arquivo
# junto com esses overlays.
# No EKS, o workflow gera o Secret a partir do Secrets Manager. Não coloque
# AWS_ACCESS_KEY_ID no pod: SES, se escolhido, usa a role do nó.
# No Gmail, use smtp.gmail.com:587 e uma senha de app. Nunca commite valores reais.
# Para ativar links, configure APPROVAL_TOKEN_SECRET e PUBLIC_BASE_URL juntos.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-api-secrets
type: Opaque
stringData:
  DB_PASSWORD: ""
  JWT_SECRET: ""
  EMAIL_PROVIDER: smtp
  AWS_REGION: us-east-1
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: "587"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_FROM_ADDRESS: ""
  APPROVAL_TOKEN_SECRET: ""
  APPROVAL_TOKEN_TTL_HOURS: "24"
  PUBLIC_BASE_URL: ""
