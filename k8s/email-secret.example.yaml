# Contrato de SMTP para ambientes Kubernetes. No EKS, o workflow gera o Secret
# a partir do Secrets Manager; localmente, use o secrets.env do overlay.
# Não coloque AWS_ACCESS_KEY_ID no pod: SES, se escolhido, usa a role do nó.
# No Gmail, use smtp.gmail.com:587 e uma senha de app.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-email
type: Opaque
stringData:
  EMAIL_PROVIDER: smtp
  AWS_REGION: us-east-1
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: "587"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_FROM_ADDRESS: ""
