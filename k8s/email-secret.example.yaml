# Contrato das variáveis de e-mail. O Deployment não monta este Secret.
# No EKS o Kustomize do overlay injeta EMAIL_PROVIDER, AWS_REGION e
# SES_FROM_ADDRESS no ConfigMap oficina-api-config. Não defina
# AWS_ACCESS_KEY_ID no pod: a role do nó envia o e-mail.
#
# O SES nasce em sandbox: a mensagem só sai se o remetente e o destinatário
# forem identidades verificadas. Não commitar valores reais.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-email
type: Opaque
stringData:
  EMAIL_PROVIDER: ses
  AWS_REGION: us-east-1
  SES_FROM_ADDRESS: ""
