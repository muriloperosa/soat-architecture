# Exemplo completo das variáveis injetadas pela API. Este manifesto é apenas
# referência para configuração manual/local, como Minikube. Docker Compose
# usa as variáveis do .env, não este Secret. Nos overlays Kustomize, o Secret
# é gerado de overlays/{minikube,eks}/secrets.env; não aplique este arquivo
# junto com esses overlays.
# No EKS, o pod usa a role do nó para acessar o SES: não injete access keys
# nem AWS_SESSION_TOKEN. As chaves abaixo servem somente para uso local.
#
# Para envio SES local, altere EMAIL_PROVIDER para ses, preencha o remetente e
# as credenciais AWS. Credenciais temporárias também exigem AWS_SESSION_TOKEN.
# No sandbox do SES, remetente e destinatário precisam ser identidades
# verificadas. Nunca commite valores reais.
# Para ativar links, configure APPROVAL_TOKEN_SECRET e PUBLIC_BASE_URL juntos.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-api-secrets
type: Opaque
stringData:
  DB_PASSWORD: ""
  JWT_SECRET: ""
  EMAIL_PROVIDER: log
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_SESSION_TOKEN: ""
  SES_FROM_ADDRESS: ""
  APPROVAL_TOKEN_SECRET: ""
  APPROVAL_TOKEN_TTL_HOURS: "24"
  PUBLIC_BASE_URL: ""
