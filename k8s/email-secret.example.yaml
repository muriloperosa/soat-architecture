# Exemplo de Secret para o provedor SES. A aplicação só lê variáveis de
# ambiente; este Secret é a forma de injetá-las no cluster.
#
# O SES do AWS Academy opera em sandbox: a mensagem só é entregue se o
# remetente e o destinatário forem identidades verificadas na conta do lab.
# Não commitar valores reais. Copie este arquivo e preencha localmente.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-email
type: Opaque
stringData:
  EMAIL_PROVIDER: ses
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_SESSION_TOKEN: ""
  SES_FROM_ADDRESS: ""
