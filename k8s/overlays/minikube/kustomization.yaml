
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oficina

resources:
  - namespace.yaml
  - ../../base
  - mysql-service.yaml
  - mysql-statefulset.yaml

patches:
  - path: api-service-patch.yaml

images:
  - name: oficina-api
    newName: oficina-api
    newTag: local
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: oficina-api-config
    behavior: merge
    literals:
      - DB_HOST=oficina-mysql

secretGenerator:
  - name: oficina-api-secrets
    envs:
      - secrets.env
